name: VinylSetBuilder
options:
  bundleIdPrefix: com.rishizamvar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  VinylSetBuilderCore:
    path: VinylSetBuilderCore
targets:
  VinylSetBuilder:
    type: application
    platform: iOS
    sources:
      - path: App
      # CAP-01/CAP-04: the simulator has no camera, so the owner's twelve real photographs are
      # bundled and read through the SAME Vision + segmentation path a live capture takes.
      # A folder reference, so the twelve land at Labels/ inside the bundle.
      # ponytail: 25 MB of HEIC in the app. Drop this entry once the device path is the only
      # one being exercised — nothing but SleevePhotoSource.bundledFixtures() reads it.
      - path: Tests/Fixtures/Labels
        type: folder
        buildPhase: resources
    dependencies:
      - package: VinylSetBuilderCore
        product: VinylSetBuilderCore
    info:
      path: App/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Vinyl Set Builder
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Vinyl Set Builder photographs your record labels to read their track listings. Photographs are read on device and are not kept.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.VinylSetBuilder
        ENABLE_USER_SCRIPT_SANDBOXING: NO       # D10: the secrets script reads ~/.config/keys/
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 373D7DZ9NM
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - script: "\"$SRCROOT/Scripts/generate-secrets.sh\""
        name: Generate Secrets.swift
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Generated/Secrets.swift
      # BPM-02: the tier-0 corpus, bundled as a resource. Same treatment as Secrets.swift —
      # generated from a local file, gitignored, never in the public repo.
      - script: "\"$SRCROOT/Scripts/generate-corpus.sh\""
        name: Generate bpmkey.tsv
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Generated/bpmkey.tsv

  VinylSetBuilderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VinylSetBuilder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.VinylSetBuilderUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VinylSetBuilder
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"

# A REAL shared scheme, checked into project.yml rather than left to xcodebuild's
# autocreation. The autocreated scheme has no test action and therefore cannot run a
# UI test target at all (02-02).
schemes:
  VinylSetBuilder:
    build:
      targets:
        VinylSetBuilder: all
        VinylSetBuilderUITests: [test]
    test:
      targets: [VinylSetBuilderUITests]
